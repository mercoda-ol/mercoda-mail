<!DOCTYPE html>

<script>
/* 主题防闪（第21轮）：首帧前应用 data-theme，默认暗色，持久化键 mm-theme */
(function(){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('mm-theme')||'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();

<body>

  <nav class="nav">

  </nav>
  <div class="sidebar-foot">v1.0 · IMAP IDLE 实时收信</div>
</aside>

<!-- 主区域 -->
<div class="main">
  <div class="topbar">
    <h2 id="page-title">邮件列表</h2>
    <span class="sub" id="topbar-sub">
      <button class="theme-btn" id="theme-toggle" title="切换 暗色/亮色 主题" onclick="toggleTheme()">
        <svg class="ic-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="ic-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
      <span class="sync-progress" id="sync-progress">
        <span class="spin"></span>
        <span id="sync-text">同步中…</span>
        <span class="bar"><i id="sync-bar"></i></span>
      </span>
    </span>
  </div>
  <div class="content">

    <!-- 统计卡 -->
    <div class="stats" id="stats">
      <div class="stat"><div class="stat-icon indigo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></div><div><div class="stat-val" id="stat-emails">–</div><div class="stat-label">邮件总数</div></div></div>
      <div class="stat"><div class="stat-icon red"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></div><div><div class="stat-val" id="stat-orders">–</div><div class="stat-label">订单总数</div></div></div>
      <div class="stat"><div class="stat-icon green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div><div><div class="stat-val" id="stat-online">–</div><div class="stat-label">在线账号</div></div></div>
    </div>

    <!-- 邮件列表 -->
    <section id="page-emails" class="view">
      <div class="card">
        <div class="toolbar">
          <select id="email-account" data-filter="email"><option value="">全部账号</option></select>
          <input type="text" class="q" id="email-q" placeholder="搜索主题…">
          <button class="btn" onclick="loadEmails(1)">搜索</button>
          <div class="spacer"></div>
          <button class="btn" id="email-batchdel" disabled onclick="deleteSelected()">删除所选 (0)</button>
          <button class="btn" id="email-readall" onclick="markAllRead()">全部已读</button>
          <label class="chk"><input type="checkbox" id="email-auto" checked> 自动刷新</label>
        </div>
        <div class="newmail-banner" id="newmail-banner" onclick="refreshFromBanner()" role="button" title="点击刷新列表">

          <span class="newmail-cta">点击刷新 →</span>

        <table>
          <thead><tr><th style="width:38px"><input type="checkbox" id="email-chkall" title="全选本页"></th><th style="width:110px">账号</th><th style="width:190px">发件人</th><th>主题</th><th style="width:150px">时间</th><th style="width:130px">分类</th><th style="width:56px"></th></tr></thead>
          <tbody id="email-rows"></tbody>
        </table>
        <div class="pager">
          <button class="btn" id="email-prev" onclick="loadEmails(emailPage-1)">上一页</button>
          <span class="info" id="email-pageinfo"></span>

    <!-- 账号管理 -->
    <section id="page-accounts" class="view" style="display:none">
      <div class="card">
        <div class="toolbar">
          <button class="btn btn-primary" onclick="editAccount(0)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>新增账号
          </button>
          <span class="muted">保存后即时生效，无需重启 · OAuth2 账号需先命令行授权</span>
        </div>
        <table>
          <thead><tr><th>名称</th><th>邮箱</th><th>服务商</th><th>IMAP</th><th>认证</th><th>状态</th><th style="width:120px">操作</th></tr></thead>

        </table>

    </section>

    <!-- 规则管理 -->
    <section id="page-rules" class="view" style="display:none">

            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>新增规则
          </button>

        </div>
        <table>
          <thead><tr><th style="width:70px">优先级</th><th style="width:130px">规则名</th><th style="width:100px">分类</th><th style="width:70px">告警</th><th>关键词</th><th style="width:120px">操作</th></tr></thead>

<!-- 通用编辑弹窗 -->
<div class="overlay" id="modal">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <h3 id="modal-title"></h3>
      <button class="modal-x" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="modal-save">保存</button>
    </div>
  </div>
</div>

<!-- 确认弹窗 -->
<div class="overlay" id="confirm">
  <div class="modal" style="width:380px" onclick="event.stopPropagation()">
    <div class="modal-head"><h3 id="confirm-title">确认操作</h3><button class="modal-x" onclick="closeConfirm()">&times;</button></div>
    <div class="modal-body"><p id="confirm-msg" style="font-size:13.5px;color:var(--text-2);line-height:1.6"></p></div>
    <div class="modal-foot">
      <button class="btn" onclick="closeConfirm()">取消</button>
      <button class="btn btn-danger" id="confirm-ok">确认</button>
    </div>
  </div>
</div>

<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <h3 id="drawer-subject">(无主题)</h3>
    <div class="trans-tools">
      <select id="drawer-tr-lang" title="原文语言（Edge 翻译需指定源语言）">
        <option value="es" selected>西语</option>
        <option value="en">英语</option>
        <option value="pt">葡语</option>
      </select>
      <button class="btn" id="drawer-trans" onclick="translateEmail()" title="用 Edge 内置翻译将正文转为中文">🌐 翻译</button>
    </div>
    <button class="icon-btn danger" id="drawer-delete" title="删除（同时从服务器删除）">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
    </button>
    <button class="modal-x" onclick="closeDrawer()" title="关闭 (ESC)">&times;</button>
  </div>
  <dl class="drawer-meta">
    <dt>发件人</dt><dd id="drawer-from">-</dd>
    <dt>账号</dt><dd id="drawer-account">-</dd>
    <dt>时间</dt><dd id="drawer-time">-</dd>
    <dt>分类</dt><dd id="drawer-category">-</dd>
    <dt>命中规则</dt><dd id="drawer-rule">-</dd>
  </dl>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<div class="toasts" id="toasts"></div>

<script>
const catName = {order:'订单', abnormal_order:'异常订单', account_security:'账号安全', customer_support:'客服支持', listing_optimization:'商品优化', other:'其他'};
// 邮件正文深色底样式：邮件 HTML 多为白底，拼到 srcdoc 最前覆盖（!important 压过邮件内联样式）
/* 邮件详情 iframe（第24轮深色教训）：邮件原样渲染，不做主题反转——曾强制
   html,body 背景/字色，邮件自带浅色表格背景铺满+无色文本继承强制浅字=浅底浅字
   看不清（截图实锤）；亮色正常纯因强制的是深字。抽屉周边 UI 保持主题色即可 */
function mailIframeStyle(){
  return '<style>body{margin:0;padding:14px}</style>';
}

/* 主题切换（第21轮）：暗/亮两套，localStorage 持久化；邮件 iframe 不随主题
   重绘（第24轮：mailIframeStyle 已无主题色，重设 srcdoc 只会重置滚动） */
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  try{ localStorage.setItem('mm-theme',next); }catch(e){}
}
const titles = {accounts:'账号管理', rules:'规则管理'};
let currentTab='emails', currentCategory='order', emailPage=1;
let accountsCache=[], rulesCache=[], confirmFn=null;

/* ===== Toast ===== */
function toast(msg, type='ok'){
  const box=document.getElementById('toasts');
  const t=document.createElement('div');
  t.className='toast '+type;
  t.innerHTML=`<span>${esc(msg)}</span><button class="tclose" onclick="this.parentElement.remove()">&times;</button>`;
  box.appendChild(t);
  setTimeout(()=>t.remove(), 3500);
}

/* ===== 弹窗 ===== */
function openModal(title, bodyHTML, onSave){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=bodyHTML;
  document.getElementById('modal-save').onclick=onSave;
  document.getElementById('modal-save').style.display='';
  const cancelBtn=document.querySelector('#modal .modal-foot .btn');
  if(cancelBtn) cancelBtn.textContent='取消';
  document.getElementById('modal').classList.add('show');
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
function openConfirm(title, msg, fn){
  document.getElementById('confirm-title').textContent=title;
  document.getElementById('confirm-msg').textContent=msg;
  confirmFn=fn;
  document.getElementById('confirm').classList.add('show');
}
function closeConfirm(){ document.getElementById('confirm').classList.remove('show'); confirmFn=null; }
document.getElementById('confirm-ok').onclick=()=>{ if(confirmFn) confirmFn(); closeConfirm(); };
// 注意：不给遮罩加 click 关闭——误点外部区域关掉表单太烦人，只认 ✕/取消/ESC
document.getElementById('confirm').addEventListener('click', closeConfirm);
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeModal(); closeConfirm(); } });

/* ===== 校验 ===== */
function invalidate(id, msg){
  const f=document.getElementById(id).closest('.field');
  f.classList.add('invalid');
  const err=f.querySelector('.err'); if(err) err.textContent=msg;
  document.getElementById(id).focus();
  return false;
}
function clearInvalid(scope){
  scope.querySelectorAll('.field.invalid').forEach(f=>f.classList.remove('invalid'));
}

/* ===== 密码眼睛 ===== */
function pwEye(inputId){
  return `<button type="button" class="pw-eye" onclick="const i=document.getElementById('${inputId}');i.type=i.type==='password'?'text':'password'">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>`;
}

/* ===== 导航 ===== */
document.querySelectorAll('.nav-item').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const tab=btn.dataset.tab;
    if(tab==='emails'){
      switchTab('emails', btn.dataset.category);
    } else {
      switchTab(tab);
    }
  });
});
function switchTab(name, category){
  currentTab=name;
  if(name==='emails' && category) currentCategory=category;
  document.querySelectorAll('.nav-item').forEach(b=>{
    if(b.dataset.tab==='emails'){
      b.classList.toggle('active', name==='emails' && b.dataset.category===currentCategory);
    } else {
      b.classList.toggle('active', b.dataset.tab===name);
    }
  });
  for(const t of ['emails','accounts','rules']){
    document.getElementById('page-'+t).style.display = t===name?'':'none';
  }
  document.getElementById('page-title').textContent = name==='emails' ? (catName[currentCategory]||'邮件') : titles[name];
  document.getElementById('stats').style.display = (name==='accounts'||name==='rules')?'none':'';
  if(name==='emails') loadEmails(1);
  if(name==='accounts') loadAccountsMgr();
  if(name==='rules') loadRules();
}

/* ===== 骨架屏 ===== */
function skeleton(tbodyId, cols){
  let html='';
  for(let i=0;i<6;i++){
    html+='<tr class="skeleton">';
    for(let c=0;c<cols;c++) html+='<td><div class="sk" style="width:'+(60+Math.random()*35)+'%"></div></td>';
    html+='</tr>';
  }
  document.getElementById(tbodyId).innerHTML=html;
}
function emptyRow(tbodyId, cols, msg){
  document.getElementById(tbodyId).innerHTML=
    `<tr><td colspan="${cols}"><div class="empty">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
      <p>${msg}</p></div></td></tr>`;
}

/* ===== 统计 ===== */
async function loadStats(){
  try{
    const [re, ro, rac] = await Promise.all([fetch('/api/emails?page=1'), fetch('/api/emails?category=order&page=1'), fetch('/api/accounts')]);
    const de=await re.json(), dor=await ro.json(), dac=await rac.json();
    document.getElementById('stat-emails').textContent=de.total||0;
    document.getElementById('stat-orders').textContent=dor.total||0;
    document.getElementById('stat-online').textContent=(dac.items||[]).filter(a=>a.online).length+'/'+(dac.items||[]).length;
    accountsCache=dac.items||[];
    fillAccountSelects();
  }catch(e){}
}
function fillAccountSelects(){
  for(const [selId, keep] of [['email-account',true]]){
    const sel=document.getElementById(selId);
    const cur=sel.value;
    sel.innerHTML='<option value="">全部账号</option>';
    for(const a of accountsCache) sel.add(new Option(a.name, a.name));
    if(keep && cur) sel.value=cur;
  }
}

/* ===== 邮件 ===== */
let emailPageSize=14;
async function loadEmails(page, silent){
  if(page<1) page=1; emailPage=page;
  if(!silent) skeleton('email-rows', 7); // 静默刷新不换骨架（防 30s 闪烁打断浏览）
  const p=new URLSearchParams({page, account:el('email-account').value, category:currentCategory, q:el('email-q').value});
  try{
    const d=await (await fetch('/api/emails?'+p)).json();
    const pageSize=d.page_size||emailPageSize; emailPageSize=pageSize;
    const total=d.total||0, pages=Math.max(1,Math.ceil(total/pageSize));
    const items=d.items||[];

            </button>

      : `<tr><td colspan="7"><div class="empty">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <p>暂无邮件，等待收信中…</p></div></td></tr>`;
    const tbody=document.getElementById('email-rows');
    if(silent && tbody.innerHTML===html){
      // 内容无变化：跳过 DOM 重建（保留滚动/勾选/详情），只刷页码文字

function closeDrawer(){

/* ===== 邮件翻译：通道1 本地 Edge Translator（优先，零外网依赖），
   确实不可用（API 不存在/初始化失败）才走通道2 后端 /api/translate 代理。
   限制: 本机 Edge 实测不支持 sourceLanguage:'auto'，需手动选源语言；
   模型 downloadable 时 create 需用户手势（点击按钮即满足），首次可能要下载模型 */
let drawerEmail=null, drawerTransHTML=null;
async function translateEmail(){
  const btn=document.getElementById('drawer-trans');
  if(!drawerEmail) return;
  const fr=document.querySelector('#drawer-body iframe');
  // 已翻译 → 切回原文
  if(drawerTransHTML){
    if(fr) fr.srcdoc=mailIframeStyle()+drawerEmail.html_body;
    drawerTransHTML=null;
    btn.textContent='🌐 翻译';
    return;
  }
  const lang=document.getElementById('drawer-tr-lang').value;
  const orig=drawerEmail.html_body||'';
  btn.disabled=true; btn.textContent='翻译中…';
  try{
    const doc=new DOMParser().parseFromString(orig,'text/html');
    const walker=document.createTreeWalker(doc, NodeFilter.SHOW_TEXT);
    const nodes=[];
    let node;
    while((node=walker.nextNode())){
      if(node.nodeValue && node.nodeValue.trim()) nodes.push(node);
    }
    if(!fr){ toast('正文不是 HTML，无法翻译','err'); return; }
    if(!nodes.length){ toast('正文无可翻译文本','err'); return; }

    // 通道1（优先）：本地 Edge Translator
    if(typeof Translator!=='undefined'){
      let t=null;
      try{
        t=await Translator.create({sourceLanguage:lang, targetLanguage:'zh-CN'});
      }catch(e){
        if(e && e.name==='NotAllowedError'){
          toast('首次需下载翻译模型，请稍候再点一次','err');
          return;
        }
        console.warn('[translate] 本地 Translator 不可用，转网络翻译:', e && (e.name+': '+e.message));
      }
      if(t){
        for(const tn of nodes){ tn.nodeValue=await t.translate(tn.nodeValue); }
        const out=new XMLSerializer().serializeToString(doc);
        fr.srcdoc=mailIframeStyle()+out; drawerTransHTML=out;
        btn.textContent='显示原文';
        toast('已翻译为中文（本地）');
        return;
      }
    }

    // 通道2（兜底）：本地 API 不存在或初始化失败 → 后端代理
    await translateViaServer(nodes, lang);
    const out=new XMLSerializer().serializeToString(doc);
    fr.srcdoc=mailIframeStyle()+out; drawerTransHTML=out;
    btn.textContent='显示原文';
    toast('已翻译为中文（网络）');
  }catch(e){
    if(trUserAbort){ trUserAbort=false; return; } // 关详情主动中止：静默
    const msg=(e&&(e.name+': '+e.message))||String(e);
    toast('翻译失败: '+msg,'err');
    console.warn('[translate]', msg);
  }finally{
    btn.disabled=!(drawerEmail&&drawerEmail.html_body&&drawerEmail.html_body.trim());
    if(btn.textContent==='翻译中…') btn.textContent='🌐 翻译';
  }
}

/* 在途网络翻译的 AbortController 集合与用户主动中止标志（closeDrawer 用） */
let translateControllers=new Set();
let trUserAbort=false;
let trBrokenUntil=0; // 全败冷却截止时刻：40 秒自动解封（用户裁定 30~50s 区间取中值）

// translateViaServer 逐段走后端代理。教训（列表卡死根因）：曾一次 Promise.all
// 全并发 N 个请求，占满浏览器同域 6 连接、每批等后端 10s 超时，列表 fetch 排队
// 几十秒。改为：并发池上限 2 + 每请求 12s Abort 超时（须 ≥ config translate.
// timeout_seconds 的 10s+余量，改大该 config 需同步此值）+ 全败后 5 分钟冷却。
async function translateViaServer(nodes, lang){
  if(Date.now()<trBrokenUntil){
    throw new Error('网络翻译刚刚失败过，'+Math.ceil((trBrokenUntil-Date.now())/1000)+' 秒后可重试');
  }
  const results=new Array(nodes.length);
  const total=nodes.length;
  let idx=0, fails=0, ok=0, firstErr=null;
  const worker=async ()=>{
    while(idx<total){
      if(firstErr) throw firstErr;
      const i=idx++;
      const ctrl=new AbortController();
      translateControllers.add(ctrl);
      const timer=setTimeout(()=>{ try{ ctrl.abort(); }catch(e){} }, 12000);
      try{
        const r=await fetch('/api/translate',{method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({text:nodes[i].nodeValue, source:lang, target:'zh-CN'}),
          signal:ctrl.signal});
        const d=await r.json();
        if(!r.ok) throw new Error(d.error||'代理翻译失败');
        if(d.text){ results[i]=d.text; ok++; }
      }catch(e){
        fails++;
        if(!firstErr) firstErr=e;
        throw e;
      }finally{
        clearTimeout(timer);
        translateControllers.delete(ctrl);
      }
    }
  };
  try{
    await Promise.all([worker(), worker()]); // 并发 2：列表始终有 4 个连接可用
  }catch(e){
    if(ok===0) trBrokenUntil=Date.now()+40*1000; // 全败进 40s 冷却（偶发单段失败不熔）
    throw e;
  }
  results.forEach((t,i)=>{ if(t) nodes[i].nodeValue=t; });
}

function onProviderChange(id){
  const p=el('amgr-provider').value;
  const preset=providerIMAP[p]||providerIMAP.generic;
  // 编辑已有账号时不覆盖已填的自定义 host；新增/切服务商标配时带出
  const hostInput=el('amgr-imaphost');
  const isNew=!id;
  const currentHost=hostInput.value.trim();
  const knownHosts=Object.values(providerIMAP).map(x=>x.host).filter(Boolean);
  if(isNew || !currentHost || knownHosts.includes(currentHost)){
    hostInput.value=preset.host;
    el('amgr-imapport').value=preset.port;
  }
}

      <span class="muted">最长等待 5 分钟</span>
    </p>
    <div id="oauth-status" style="margin-top:14px;padding:12px;border-radius:8px;background:var(--bg);font-size:13px">
      ⏳ 等待浏览器授权…
    </div>`;
  openModal('OAuth2 授权', body, ()=>{});
  document.getElementById('modal-save').style.display='none';
  document.querySelector('#modal .modal-foot .btn').textContent='关闭';

  const deadline=Date.now()+5*60*1000;
  const timer=setInterval(async ()=>{
    const box=document.getElementById('oauth-status');
    if(!box || !document.getElementById('modal').classList.contains('show')){
      clearInterval(timer); document.getElementById('modal-save').style.display=''; return;
    }
    if(Date.now()>deadline){
      box.innerHTML='⏰ 等待超时，请关闭后重试';
      box.style.color='var(--danger)';
      clearInterval(timer); document.getElementById('modal-save').style.display=''; return;
    }
    try{
      const s=await (await fetch(`/api/accounts/${id}/auth_status`)).json();
      if(s.status==='success'){
        box.innerHTML='✅ 授权成功！refresh token 已加密保存，可关闭此窗口。';
        box.style.color='var(--success)';
        clearInterval(timer); document.getElementById('modal-save').style.display='';
        toast(`${name} 授权成功`);
        loadAccountsMgr();
      } else if(s.status==='failed'){
        box.innerHTML='❌ 授权失败：'+esc(s.error||'未知错误');
        box.style.color='var(--danger)';
        clearInterval(timer); document.getElementById('modal-save').style.display='';
        toast('授权失败：'+(s.error||'未知错误'),'err');
      }
    }catch(e){}
  }, 2000);
}

/* ===== 规则 ===== */
async function loadRules(){
  skeleton('rule-rows', 6);
  try{
    const d=await (await fetch('/api/rules')).json();
    rulesCache=d.items||[];
    if(!rulesCache.length){ emptyRow('rule-rows',6,'暂无规则，点击左上角新增'); return; }
    document.getElementById('rule-rows').innerHTML=rulesCache.map(rl=>`
      <tr>
        <td class="muted">${rl.priority}</td>
        <td><strong>${esc(rl.name)}</strong></td>
        <td><span class="tag tag-${rl.category}">${catName[rl.category]||rl.category}</span></td>
        <td>${rl.alert?'🔔':'—'}</td>
        <td class="muted truncate" title="${esc((rl.keywords||[]).join('，'))}">${esc((rl.keywords||[]).join('，'))}</td>
        <td>
          <button class="btn-sm" onclick="editRule(${rl.id})">编辑</button>
          <button class="btn-sm danger" onclick="removeRule(${rl.id}, '${esc(rl.name)}')">删除</button>
        </td>
      </tr>`).join('');
  }catch(e){ emptyRow('rule-rows',6,'加载失败'); }
}

function editRule(id){
  const rl=rulesCache.find(r=>r.id===id)||{};
  const body=`
    <div class="field" id="f-rname"><label>规则名</label><input type="text" id="rl-name" value="${esc(rl.name||'')}" placeholder="订单异常"><div class="err">请填写规则名</div></div>
    <div class="field"><label>分类</label><select id="rl-category">
      <option value="abnormal_order" ${rl.category==='abnormal_order'?'selected':''}>异常订单</option>
      <option value="order" ${rl.category==='order'?'selected':''}>订单</option>
      <option value="account_security" ${rl.category==='account_security'?'selected':''}>账号安全</option>
      <option value="customer_support" ${rl.category==='customer_support'?'selected':''}>客服支持</option>
      <option value="listing_optimization" ${rl.category==='listing_optimization'?'selected':''}>商品优化</option>
      <option value="other" ${rl.category==='other'?'selected':''}>其他</option>
    </select></div>
    <div class="field"><label class="chk"><input type="checkbox" id="rl-alert" ${rl.alert!==false?'checked':''}> 命中时触发告警弹窗+声音</label></div>
    <div class="field" id="f-rkw"><label>关键词（逗号分隔，中英文均可）</label>
      <textarea id="rl-keywords" rows="4" placeholder="订单超时, order timeout, refund">${esc((rl.keywords||[]).join(', '))}</textarea>
      <div class="err">请填写至少一个关键词</div></div>
    <div class="field"><label>优先级（数字越小越先匹配）</label><input type="number" id="rl-priority" value="${rl.priority??0}"></div>`;
  openModal(id?'编辑规则':'新增规则', body, saveRule);
  modalEditId=id;
}

async function saveRule(){
  const bodyEl=document.getElementById('modal-body');
  clearInvalid(bodyEl);
  const body={
    id: Number(modalEditId)||0,
    name: el('rl-name').value.trim(),
    category: el('rl-category').value,
    alert: el('rl-alert').checked,
    keywords: el('rl-keywords').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean),
    priority: parseInt(el('rl-priority').value)||0
  };
  if(!body.name) return invalidate('rl-name','请填写规则名');
  if(!body.keywords.length) return invalidate('rl-keywords','请填写至少一个关键词');
  try{
    const d=await (await fetch('/api/rules',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
    if(d.error){ toast(d.error,'err'); return; }
    toast(body.id?'规则已更新':'规则已新增'); closeModal(); loadRules();
  }catch(e){ toast('保存失败','err'); }
}

function removeRule(id, name){
  openConfirm('删除规则', `确认删除规则「${name}」？删除后该类邮件将不再被分类为对应类别。`, async ()=>{
    try{
      const d=await (await fetch('/api/rules/'+id,{method:'DELETE'})).json();
      if(d.error){ toast(d.error,'err'); return; }
      toast('规则已删除'); loadRules();
    }catch(e){ toast('删除失败','err'); }
  });
}

/* ===== 工具 ===== */
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(s){
  if(!s||s.startsWith('0001')) return '-';
  try{ return new Date(s).toLocaleString('zh-CN',{hour12:false}); }catch(e){ return s; }
}
document.getElementById('email-q').addEventListener('keydown', e=>{ if(e.key==='Enter') loadEmails(1); });
document.querySelectorAll('select[data-filter]').forEach(s=>{
  s.addEventListener('change', ()=>{
    if(s.dataset.filter==='email') loadEmails(1);
  });
});

/* ===== 自动刷新 ===== */
// SSE 高频事件的统计刷新防抖合并：收信风暴时多事件 600ms 内只发一轮请求，
// 避免 main thread fetch 堆积造成卡顿（手动刷新路径仍直接调用）
let statsTimer=null;
function scheduleStats(){
  if(statsTimer) return;
  statsTimer=setTimeout(()=>{ statsTimer=null; loadStats(); loadUnreadCounts(); },600);
}
setInterval(()=>{
  if(!document.getElementById('email-auto').checked) return;
  if(currentTab==='emails') loadEmails(emailPage, true); // 静默：无变化不重建、有变化保勾选、不闪骨架
}, 30000);

/* ===== SSE 实时推送 ===== */
let es=null;
function connectSSE(){
  if(es){ es.close(); }
  es=new EventSource('/api/events');

  es.addEventListener('new_email', e=>{
    try{
      const d=JSON.parse(e.data).data||{};
      if(!d.silent) toast(`新邮件 · ${d.account}: ${d.subject||'(无主题)'}`);
      // 横幅提示（不打断正在浏览的列表；silent 批量首拉不弹，靠 sync 收尾横幅）
      if(currentTab==='emails' && !d.silent) bannerPing(1);
      if(!d.silent) scheduleStats();
    }catch(err){}
  });

  es.addEventListener('new_alert', e=>{
    try{
      const d=JSON.parse(e.data).data||{};
      if(!d.silent) toast(`🔔 告警 [${catName[d.category]||d.category}] ${d.account}: ${d.subject||''}`, 'err');
      if(currentTab==='emails' && !d.silent) bannerPing(1);
      if(!d.silent) scheduleStats();
    }catch(err){}
  });

  es.addEventListener('account_status', e=>{
    try{
      const d=JSON.parse(e.data).data||{};
      scheduleStats();
      if(currentTab==='accounts') loadAccountsMgr();
      if(!d.online) toast(`账号 ${d.account} 离线: ${d.error||''}`,'err');
    }catch(err){}
  });

  es.addEventListener('sync_summary', e=>{
    try{
      const d=JSON.parse(e.data).data||{};
      const n=d.count||0, ac=d.alert_count||0;
      if(n>0){
        let msg=`📩 ${d.account}: 收到 ${n} 封新邮件`;
        if(ac>0){
          const cats=Object.entries(d.categories||{}).map(([k,v])=>`${catName[k]||k}×${v}`).join('、');
          msg+=` · 🔔 告警 ${ac} 封（${cats}）`;
        }
        toast(msg, ac>0?'err':'ok');
      }
      if(currentTab==='emails' && n>0) bannerPing(n);
      scheduleStats();
    }catch(err){}
  });

  es.addEventListener('sync_progress', e=>{
    try{
      const d=JSON.parse(e.data).data||{};
      const box=document.getElementById('sync-progress');
      box.classList.add('show');
      document.getElementById('sync-text').textContent=
        `同步中 ${d.account} · 已收 ${d.fetched} 封`;
      document.getElementById('sync-bar').style.width=(d.percent||0)+'%';
    }catch(err){}
  });

  es.addEventListener('sync_done', e=>{
    try{
      const d=JSON.parse(e.data).data||{};
      const box=document.getElementById('sync-progress');
      document.getElementById('sync-text').textContent=`同步完成 · 共 ${d.fetched} 封`;
      document.getElementById('sync-bar').style.width='100%';
      setTimeout(()=>box.classList.remove('show'), 2500);
      if(currentTab==='emails' && (d.fetched||0)>0) bannerPing(d.fetched);
      scheduleStats();
    }catch(err){}
  });

  es.onerror=()=>{
    // 断线 3 秒后自动重连（EventSource 自带重连，这里兜底重建）
    es.close();
    setTimeout(connectSSE, 3000);
  };
}

/* ===== 初始化 ===== */
connectSSE();
loadStats();
loadUnreadCounts();
loadEmails(1);
</script>
